<rect x="94" y="172" width="47" height="24" rx="12.0" fill="#3B2F0E" stroke="#FBBF24" stroke-opacity=".35"/><text class="t" x="117.5" y="188.32" font-size="12" fill="#FBBF24" text-anchor="middle" font-weight="600">GGUF</text>
<rect x="149" y="172" width="82" height="24" rx="12.0" fill="#3B2F0E" stroke="#FBBF24" stroke-opacity=".35"/><text class="t" x="190.0" y="188.32" font-size="12" fill="#FBBF24" text-anchor="middle" font-weight="600">llama.cpp</text></g>
<g class="fade d2"><rect x="32" y="204" width="103" height="24" rx="12.0" fill="#3B2F0E" stroke="#FBBF24" stroke-opacity=".35"/><text class="t" x="83.5" y="220.32" font-size="12" fill="#FBBF24" text-anchor="middle" font-weight="600">Hugging Face</text>
<rect x="143" y="204" width="61" height="24" rx="12.0" fill="#3B2F0E" stroke="#FBBF24" stroke-opacity=".35"/><text class="t" x="173.5" y="220.32" font-size="12" fill="#FBBF24" text-anchor="middle" font-weight="600">Ollama</text></g>

<g class="fade d3">
  <rect x="296" y="34" width="250" height="182" rx="12" fill="#0B1220" stroke="#22314F"/>
  <text class="t" x="316" y="64" font-size="13" font-weight="700" fill="#F1F5F9">Knot Scribe <tspan fill="#64748B" font-weight="500">· 7B</tspan></text>
  <text class="t" x="316" y="122" font-size="46" font-weight="800" fill="#FBBF24">60%</text>
  <text class="t" x="316" y="148" font-size="13" fill="#F1F5F9">commit-type accuracy</text>
