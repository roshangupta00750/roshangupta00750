<text class="t fade d1" x="470" y="72" font-size="15" fill="#F1F5F9"><tspan font-weight="700">The Indian Garage Co.</tspan><tspan fill="#94A3B8"> · Data Analyst · 2023–24</tspan></text>

<g class="fade d1">
