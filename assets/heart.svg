<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" viewBox="0 0 410 210" role="img">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
<rect x="1" y="1" width="408" height="208" rx="16" fill="#0F1729" stroke="#22314F"/>

<rect x="0" y="0" width="6" height="210" fill="#FB7185" fill-opacity=".9" clip-path="url(#card)"/>
<text class="t fade" x="28" y="40" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FB7185">ON-DEVICE HEALTH ANALYTICS</text>
<rect class="fade" x="276" y="24" width="114" height="22" rx="11" fill="#3B1622"/>
<text class="t fade" x="333.0" y="39" font-size="11" font-weight="700" fill="#FB7185" text-anchor="middle">Live · v1.0.19</text>
<text class="t fade d1" x="28" y="76" font-size="24" font-weight="800" fill="#F1F5F9">Heart</text>
<text class="t fade d2" x="28" y="104" font-size="13.5" fill="#94A3B8">HRV, sleep stages and a next-day readiness</text>
<text class="t fade d2" x="28" y="124" font-size="13.5" fill="#94A3B8">forecast from a Bluetooth strap. No backend.</text>
<g class="fade d3"><rect x="28" y="166" width="64" height="22" rx="11.0" fill="#3B1622" stroke="#FB7185" stroke-opacity=".35"/><text class="t" x="60.0" y="181.14" font-size="11.5" fill="#FB7185" text-anchor="middle" font-weight="600">Flutter</text>
<rect x="98" y="166" width="91" height="22" rx="11.0" fill="#3B1622" stroke="#FB7185" stroke-opacity=".35"/><text class="t" x="143.5" y="181.14" font-size="11.5" fill="#FB7185" text-anchor="middle" font-weight="600">Time series</text>
<rect x="195" y="166" width="51" height="22" rx="11.0" fill="#3B1622" stroke="#FB7185" stroke-opacity=".35"/><text class="t" x="220.5" y="181.14" font-size="11.5" fill="#FB7185" text-anchor="middle" font-weight="600">RMSSD</text>
<rect x="252" y="166" width="38" height="22" rx="11.0" fill="#3B1622" stroke="#FB7185" stroke-opacity=".35"/><text class="t" x="271.0" y="181.14" font-size="11.5" fill="#FB7185" text-anchor="middle" font-weight="600">BLE</text></g>
